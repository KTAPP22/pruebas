<!DOCTYPE html>
<html lang="es" class="h-full bg-black select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Karting Live Timing HUD - Lucas Guerrero & Campillos</title>
  
  <!-- React & ReactDOM (Loaded globally for absolute stability) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for Dynamic Browser JSX compiling -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oled: '#000000',
            cardGray: '#0A0A0E',
            borderGray: '#1F1F24'
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', '"Roboto Mono"', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter (Sans) and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      background-color: #000000 !important;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-area-inset {
      padding-top: max(50px, calc(env(safe-area-inset-top, 0px) + 16px));
      padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
      padding-left: max(10px, env(safe-area-inset-left, 0px));
      padding-right: max(10px, env(safe-area-inset-right, 0px));
    }
  </style>
</head>
<body class="bg-black text-white antialiased overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <!-- Force disable service workers and clear cache storages for instant cross-device updates -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(names => {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <!-- 100% UNIFIED SINGLE-FILE REACT ENGINE (BABEL COMPILATION) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Circuits config with precise port mapping
    const CIRCUITS = {
      "lucas-guerrero": {
        id: "lucas-guerrero",
        name: "Lucas Guerrero (Valencia)",
        url: "https://live.apex-timing.com/kartodromo-lucas-guerrero/",
        configPort: 9950,
        columnMap: {
          no: 'c4',
          dr: 'c5',
          llp: 'c6',
          gap: 'c7',
          int: 'c8',
          blp: 'c9',
          tlp: 'c10'
        }
      },
      "campillos": {
        id: "campillos",
        name: "Kartcenter Campillos (Málaga)",
        url: "https://www.apex-timing.com/live-timing/kartcenter-campillos/",
        configPort: 9370,
        columnMap: {
          no: 'c4',
          dr: 'c5',
          llp: 'c9',
          gap: 'c11',
          int: 'c12',
          blp: 'c10',
          tlp: 'c13'
        }
      }
    };

    // =========================================================================
    // 1. TELEMETRY CONNECTOR & PARSER
    // =========================================================================
    class ApexTimingService {
      constructor() {
        this.listeners = new Set();
        this.pollTimerId = null;
        
        // Load configurations
        this.targetDriverName = localStorage.getItem('kart_target_driver_name') || 'Alex R.';
        this.activeCircuitId = localStorage.getItem('kart_active_circuit_id') || 'lucas-guerrero';
        this.targetKart = 14;

        this.configHost = 'live-data.apex-timing.com';
        this.pollInit = 1;
        this.pollIndex = 0;
        this.pollCounter = 0;
        this.randomSessionId = Math.floor(Math.random() * 1000000000) || 1;
        this.activeProxyIndex = 0;

        this.corsProxies = [
          (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
          (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
          (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];

        this.sessionRows = new Map();
        this.pitCounts = new Map(); // Track pit stops per rowId
        this.driverInPit = new Map(); // Track if driver is currently IN pit
        this.stintStartTimes = new Map(); // Track timestamp when current stint started per rowId
        this.stintStartLaps = new Map(); // Track lap count when current stint started per rowId

        // Restore saved endurance live state from localStorage
        let restoredStarted = false;
        let restoredFinished = false;
        let restoredSessionTime = "";
        let restoredDrivers = [];

        try {
          const savedStateStr = localStorage.getItem('kart_endurance_session_state');
          if (savedStateStr) {
            const savedState = JSON.parse(savedStateStr);
            if (savedState) {
              restoredStarted = Boolean(savedState.isEnduranceStarted);
              restoredFinished = Boolean(savedState.isEnduranceFinished);
              restoredSessionTime = savedState.sessionTimeText || "";
              if (Array.isArray(savedState.drivers)) restoredDrivers = savedState.drivers;
              if (Array.isArray(savedState.pitCounts)) {
                savedState.pitCounts.forEach(([rId, cnt]) => this.pitCounts.set(rId, cnt));
              }
              if (Array.isArray(savedState.driverInPit)) {
                savedState.driverInPit.forEach(([rId, bool]) => this.driverInPit.set(rId, bool));
              }
              if (Array.isArray(savedState.stintStartTimes)) {
                savedState.stintStartTimes.forEach(([rId, time]) => this.stintStartTimes.set(rId, time));
              }
              if (Array.isArray(savedState.stintStartLaps)) {
                savedState.stintStartLaps.forEach(([rId, lap]) => this.stintStartLaps.set(rId, lap));
              }
            }
          }
        } catch (e) {}

        this.state = {
          activeCircuitId: this.activeCircuitId,
          trackName: CIRCUITS[this.activeCircuitId].name,
          sessionName: "Esperando tanda en vivo...",
          sessionTimeText: restoredSessionTime,
          flagStatus: "GREEN",
          totalLaps: 0,
          isLiveConnected: false,
          isEnduranceStarted: restoredStarted,
          isEnduranceFinished: restoredFinished,
          targetDriverName: this.targetDriverName,
          matchedKartNumber: 14,
          drivers: restoredDrivers
        };
      }

      subscribe(callback) {
        this.listeners.add(callback);
        callback(this.state);
        return () => this.listeners.delete(callback);
      }

      notify() {
        this.listeners.forEach(cb => cb({ ...this.state }));
      }

      setTargetDriverName(name) {
        if (!name) return;
        this.targetDriverName = String(name).trim();
        this.state.targetDriverName = this.targetDriverName;
        localStorage.setItem('kart_target_driver_name', this.targetDriverName);
        this.resolveTargetKart();
        this.notify();
      }

      setCircuit(circuitId) {
        if (!CIRCUITS[circuitId]) return;
        this.activeCircuitId = circuitId;
        this.state.activeCircuitId = circuitId;
        this.state.trackName = CIRCUITS[circuitId].name;
        this.state.sessionName = "Cambiando de circuito...";
        this.state.drivers = [];
        this.state.isLiveConnected = false;
        
        this.pollInit = 1;
        this.pollIndex = 0;
        this.pollCounter = 0;
        this.sessionRows.clear();
        this.pitCounts.clear();
        this.driverInPit.clear();
        
        localStorage.setItem('kart_active_circuit_id', circuitId);
        
        this.stop();
        this.start();
        this.notify();
      }

      loadDemoData() {
        this.state.isLiveConnected = true;
        this.state.sessionName = "Carrera Resistencia 2H - Demo";
        this.state.sessionTimeText = "01:42:15";
        this.state.flagStatus = "GREEN";
        this.state.totalLaps = 120;
        this.state.isEnduranceStarted = true;
        this.state.isEnduranceFinished = false;

        const demoDrivers = [
          { position: 1, kartNumber: 5, name: "Carlos Sainz", lastLapMs: 48010, bestLapMs: 47980, currentLap: 50, gapLeaderMs: 0, intervalAheadMs: 0, intervalBehindMs: 12450, pitCount: 2, inPit: false },
          { position: 2, kartNumber: 8, name: "Fernando A.", lastLapMs: 48150, bestLapMs: 48010, currentLap: 49, gapLeaderMs: 12450, intervalAheadMs: 12450, intervalBehindMs: 1230, pitCount: 2, inPit: false },
          { position: 3, kartNumber: 14, name: this.targetDriverName || "Alex R.", lastLapMs: 48120, bestLapMs: 48075, currentLap: 48, gapLeaderMs: 13680, intervalAheadMs: 1230, intervalBehindMs: 890, pitCount: 1, inPit: false },
          { position: 4, kartNumber: 22, name: "Marc Gené", lastLapMs: 48340, bestLapMs: 48110, currentLap: 48, gapLeaderMs: 14570, intervalAheadMs: 890, intervalBehindMs: 3200, pitCount: 1, inPit: false },
          { position: 5, kartNumber: 11, name: "Pedro de la Rosa", lastLapMs: 48500, bestLapMs: 48200, currentLap: 47, gapLeaderMs: 17770, intervalAheadMs: 3200, intervalBehindMs: 0, pitCount: 2, inPit: false }
        ];

        this.state.drivers = demoDrivers;
        this.resolveTargetKart();
        this.notify();
      }

      resolveTargetKart() {
        if (!Array.isArray(this.state.drivers) || this.state.drivers.length === 0) return;
        const query = this.targetDriverName.toLowerCase();
        const matched = this.state.drivers.find(d => 
          d.name && d.name.toLowerCase().includes(query)
        );
        if (matched) {
          this.targetKart = matched.kartNumber;
          this.state.matchedKartNumber = matched.kartNumber;
        }
      }

      start() {
        if (this.pollTimerId) return;
        this.fetchRealApexData();
        // Jitter polling: 3s ± 500ms to avoid 6+ devices colliding on the same proxy
        const scheduleNext = () => {
          const jitter = Math.floor(Math.random() * 1000) - 500; // -500ms to +500ms
          const interval = Math.max(2000, 3000 + jitter);
          this.pollTimerId = setTimeout(() => {
            this.fetchRealApexData();
            scheduleNext();
          }, interval);
        };
        scheduleNext();
      }

      stop() {
        if (this.pollTimerId) {
          clearTimeout(this.pollTimerId);
          this.pollTimerId = null;
        }
      }

      parseTimeToMs(val) {
        if (val === undefined || val === null || val === '') return 0;
        if (typeof val === 'number') return val;
        
        const str = String(val).trim();
        if (str === '--.---' || str === '0' || str.toLowerCase().includes('l')) return 0;

        const clean = str.replace(/[^0-9:.]/g, '').trim();
        if (!clean) return 0;

        const parts = clean.split(':');
        if (parts.length === 2) {
          const min = parseFloat(parts[0]);
          const sec = parseFloat(parts[1]);
          if (!isNaN(min) && !isNaN(sec)) {
            return Math.round((min * 60 + sec) * 1000);
          }
        } else if (parts.length === 1) {
          const sec = parseFloat(parts[0]);
          if (!isNaN(sec)) {
            return Math.round(sec * 1000);
          }
        }
        return 0;
      }

      parseGapToMs(val) {
        if (val === undefined || val === null || val === '') return 0;
        const str = String(val).toLowerCase().trim();
        if (str === 'lider' || str === 'líder' || str === '0' || str === '--.---') return 0;
        const clean = str.replace(/[^0-9.]/g, '').trim();
        const sec = parseFloat(clean);
        if (!isNaN(sec)) {
          return Math.round(sec * 1000);
        }
        return 0;
      }

      async fetchRealApexData() {
        const circuit = CIRCUITS[this.activeCircuitId];
        const apiPort = circuit.configPort + 4;
        const targetUrl = `https://${this.configHost}/live-timing/commonv2/functions/live_ajax.php?version=1.0.0&init=${this.pollInit}&index=${this.pollIndex}&port=${apiPort}&counter=${this.pollCounter}&duration=100&id=${this.randomSessionId}&ignored=0`;

        for (let pi = 0; pi < this.corsProxies.length; pi++) {
          const proxyIdx = (this.activeProxyIndex + pi) % this.corsProxies.length;
          const proxyUrl = this.corsProxies[proxyIdx](targetUrl);
          
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            const response = await fetch(proxyUrl, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) continue;

            const dataText = await response.text();
            this.pollCounter += 1;

            if (dataText && dataText !== 'error' && !dataText.includes('<!DOCTYPE')) {
              const atIdx1 = dataText.indexOf('@');
              const atIdx2 = dataText.indexOf('@', atIdx1 + 1);
              
              if (atIdx1 > 0 && atIdx2 > atIdx1) {
                const newInit = parseInt(dataText.substring(0, atIdx1), 10);
                this.pollInit = newInit || this.pollInit;
                this.pollIndex = parseInt(dataText.substring(atIdx1 + 1, atIdx2), 10) || this.pollIndex;
                
                const payload = dataText.substring(atIdx2 + 1);
                this.activeProxyIndex = proxyIdx;
                this.processRawApexPayload(payload);
              }
              break;
            }
          } catch (err) {}
        }
      }

      processRawApexPayload(payload) {
        if (!payload || payload.trim() === '') return;

        const circuit = CIRCUITS[this.activeCircuitId];
        const colMap = circuit.columnMap;
        const lines = payload.split('\n');
        let hasUpdates = false;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const pipeIdx = line.indexOf('|');
          if (pipeIdx < 0) continue;

          const cellId = line.substring(0, pipeIdx);
          const rest = line.substring(pipeIdx + 1);
          const pipeIdx2 = rest.indexOf('|');
          const valueType = pipeIdx2 >= 0 ? rest.substring(0, pipeIdx2) : rest;
          const value = pipeIdx2 >= 0 ? rest.substring(pipeIdx2 + 1) : '';

          if (cellId === 'init') {
            const raceMode = localStorage.getItem('kart_race_mode') || 'sprint';
            this.sessionRows.clear();
            // Preserve pitCounts in endurance mode if race has started
            if (raceMode !== 'endurance' || !this.state.isEnduranceStarted) {
              this.pitCounts.clear();
              this.driverInPit.clear();
            }
            continue;
          }

          if (cellId === 'dyn1' || cellId === 'track') {
            const statusLower = value.toLowerCase();
            const raceMode = localStorage.getItem('kart_race_mode') || 'sprint';

            if (statusLower.includes('chequered') || statusLower.includes('cuadros') || statusLower.includes('finish') || statusLower.includes('finaliz')) {
              this.state.flagStatus = 'CHECKERED';
              if (raceMode === 'endurance') {
                this.state.isEnduranceFinished = true;
              }
            } else if (statusLower.includes('red') || statusLower.includes('roja')) {
              this.state.flagStatus = 'RED';
            } else if (statusLower.includes('yellow') || statusLower.includes('amarilla')) {
              this.state.flagStatus = 'YELLOW';
            } else {
              this.state.flagStatus = 'GREEN';
              // Green flag triggers start of endurance data collection
              if (raceMode === 'endurance' && !this.state.isEnduranceStarted) {
                this.state.isEnduranceStarted = true;
              }
            }
            continue;
          }

          // Capture session time from dynamic cells (dyn2, dyn3, etc.)
          if (cellId.startsWith('dyn') && cellId !== 'dyn1') {
            const timeMatch = value.match(/(\d{1,2}:\d{2}:\d{2})/);
            if (timeMatch) {
              this.state.sessionTimeText = timeMatch[1];
            }
            continue;
          }

          if (cellId === 'grid') {
            try {
              const gridHtml = rest.substring(pipeIdx2 + 1);
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = '<table>' + gridHtml + '</table>';

              const rows = tempDiv.querySelectorAll('tr[data-id]');
              rows.forEach(row => {
                const rId = row.getAttribute('data-id');
                if (!rId || rId === 'r0') return;

                if (!this.sessionRows.has(rId)) {
                  this.sessionRows.set(rId, {
                    position: 0,
                    kartNumber: 0,
                    name: 'Piloto',
                    lastLapMs: 0,
                    bestLapMs: 0,
                    currentLap: 0,
                    gapLeaderMs: 0,
                    intervalAheadMs: 0,
                    pitCount: this.pitCounts.get(rId) || 0,
                    inPit: this.driverInPit.get(rId) || false
                  });
                  if (!this.pitCounts.has(rId)) this.pitCounts.set(rId, 0);
                  if (!this.driverInPit.has(rId)) this.driverInPit.set(rId, false);
                }
                const entry = this.sessionRows.get(rId);

                row.querySelectorAll('[data-id]').forEach(el => {
                  const dataId = el.getAttribute('data-id');
                  if (!dataId || !dataId.startsWith(rId)) return;
                  const colSuffix = dataId.substring(rId.length);
                  const val = el.textContent.trim();
                  this.applyColumnValue(entry, colSuffix, val, colMap);
                  // Detect pit IN/OUT from any column value
                  this.detectPitStatus(rId, entry, val);
                });
              });
              hasUpdates = true;
            } catch(e) {}
            continue;
          }

          if (cellId.startsWith('r') && /^r\d+/.test(cellId)) {
            const match = cellId.match(/^(r\d+)(.+)$/);
            if (!match) continue;
            
            const rowId = match[1];
            const suffix = match[2];

            if (!this.sessionRows.has(rowId)) {
              this.sessionRows.set(rowId, {
                position: 0,
                kartNumber: 0,
                name: 'Piloto',
                lastLapMs: 0,
                bestLapMs: 0,
                currentLap: 0,
                gapLeaderMs: 0,
                intervalAheadMs: 0,
                pitCount: this.pitCounts.get(rowId) || 0,
                inPit: this.driverInPit.get(rowId) || false
              });
              if (!this.pitCounts.has(rowId)) this.pitCounts.set(rowId, 0);
              if (!this.driverInPit.has(rowId)) this.driverInPit.set(rowId, false);
            }
            const entry = this.sessionRows.get(rowId);
            if (this.applyColumnValue(entry, suffix, value, colMap)) {
              hasUpdates = true;
            }
            // Detect pit IN/OUT from cell value
            this.detectPitStatus(rowId, entry, value);
          }
        }

        if (hasUpdates) {
          this.state.isLiveConnected = true;
          this.state.drivers = Array.from(this.sessionRows.values())
            .filter(d => d.kartNumber > 0)
            .sort((a, b) => a.position - b.position);

          this.resolveTargetKart();

          for (let i = 0; i < this.state.drivers.length - 1; i++) {
            this.state.drivers[i].intervalBehindMs = this.state.drivers[i + 1].intervalAheadMs;
          }

          // Persist live endurance state to localStorage (survives app reloads/closures)
          try {
            localStorage.setItem('kart_endurance_session_state', JSON.stringify({
              isEnduranceStarted: this.state.isEnduranceStarted,
              isEnduranceFinished: this.state.isEnduranceFinished,
              sessionTimeText: this.state.sessionTimeText,
              pitCounts: Array.from(this.pitCounts.entries()),
              driverInPit: Array.from(this.driverInPit.entries()),
              stintStartTimes: Array.from(this.stintStartTimes.entries()),
              stintStartLaps: Array.from(this.stintStartLaps.entries()),
              drivers: this.state.drivers,
              timestamp: Date.now()
            }));
          } catch(e) {}

          this.notify();
        }
      }

      applyColumnValue(entry, colSuffix, value, colMap) {
        if (!colSuffix) return false;
        
        if (colSuffix === 'c1' || colSuffix === 'c2' || colSuffix === 'c3') {
          const pos = parseInt(value.replace(/[^\d]/g, ''), 10);
          if (!isNaN(pos)) {
            entry.position = pos;
            return true;
          }
        }
        if (colSuffix === colMap.no) {
          const kn = parseInt(value.replace(/[^\d]/g, ''), 10);
          if (!isNaN(kn)) {
            entry.kartNumber = kn;
            return true;
          }
        }
        if (colSuffix === colMap.dr) {
          entry.name = value.replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          return true;
        }
        if (colSuffix === colMap.llp) {
          entry.lastLapMs = this.parseTimeToMs(value);
          return true;
        }
        if (colSuffix === colMap.blp) {
          entry.bestLapMs = this.parseTimeToMs(value);
          return true;
        }
        if (colSuffix === colMap.tlp) {
          const l = parseInt(value.replace(/[^\d]/g, ''), 10);
          if (!isNaN(l)) {
            entry.currentLap = l;
            return true;
          }
        }
        if (colSuffix === colMap.gap) {
          entry.gapLeaderMs = this.parseGapToMs(value);
          return true;
        }
        if (colSuffix === colMap.int) {
          entry.intervalAheadMs = this.parseGapToMs(value);
          return true;
        }
        return false;
      }

      // Detect pit IN/OUT status per driver row (each driver tracked independently)
      detectPitStatus(rowId, entry, value) {
        if (!value || typeof value !== 'string') return;
        const raceMode = localStorage.getItem('kart_race_mode') || 'sprint';

        // In endurance mode: do not count pit stops until green flag starts race, or if checkered flag finished race
        if (raceMode === 'endurance') {
          if (!this.state.isEnduranceStarted || this.state.isEnduranceFinished) {
            entry.pitCount = this.pitCounts.get(rowId) || 0;
            entry.inPit = this.driverInPit.get(rowId) || false;
            return;
          }
        }

        const upper = value.toUpperCase().trim();
        
        // Detect IN: driver enters the box (just mark as in-pit, no count yet)
        if (upper === 'IN' || upper === 'PIT IN' || upper === 'PITIN' || upper === 'BOX IN') {
          this.driverInPit.set(rowId, true);
          entry.inPit = true;
        }
        // Detect OUT: driver exits the box → +1 pit stop confirmed (like a finish line pass)
        else if (upper === 'OUT' || upper === 'PIT OUT' || upper === 'PITOUT' || upper === 'BOX OUT') {
          if (this.driverInPit.get(rowId)) {
            // Only count if driver was marked IN first
            const count = (this.pitCounts.get(rowId) || 0) + 1;
            this.pitCounts.set(rowId, count);
            entry.pitCount = count;
            
            // Reset stint start timestamp and lap count on pit exit (OUT)
            this.stintStartTimes.set(rowId, Date.now());
            this.stintStartLaps.set(rowId, entry.currentLap);
          }
          this.driverInPit.set(rowId, false);
          entry.inPit = false;
        }
        
        // Ensure stint start timestamp is initialized if missing
        if (!this.stintStartTimes.has(rowId)) {
          this.stintStartTimes.set(rowId, Date.now());
          this.stintStartLaps.set(rowId, entry.currentLap);
        }

        // Always sync pitCount and stint metrics from stored maps
        entry.pitCount = this.pitCounts.get(rowId) || 0;
        entry.inPit = this.driverInPit.get(rowId) || false;
        entry.stintStartLap = this.stintStartLaps.get(rowId) || 0;
        entry.stintStartTime = this.stintStartTimes.get(rowId) || Date.now();
        entry.stintLaps = Math.max(0, entry.currentLap - entry.stintStartLap);
        entry.stintElapsedMs = Math.max(0, Date.now() - entry.stintStartTime);
      }

      formatTime(ms) {
        if (!ms || ms <= 0) return "--:--.---";
        const minutes = Math.floor(ms / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        const millis = ms % 1000;
        const secStr = seconds < 10 ? `0${seconds}` : `${seconds}`;
        const msStr = millis.toString().padStart(3, '0');
        if (minutes > 0) return `${minutes}:${secStr}.${msStr}`;
        return `${secStr}.${msStr}`;
      }

      formatGap(ms) {
        if (ms === 0) return "LÍDER";
        if (!ms || ms < 0) return "+0.000";
        return `+${(ms / 1000).toFixed(3)}s`;
      }
    }

    // 4. PITBOARD HUD COMPONENT (DECOUPLED MEDIA QUERIES FOR PHYSICAL ROTATION LOCK)

    function PitboardHUD({ state, targetDriverName, isLocked, isViewportPortrait, raceMode, enduranceConfig, onToggleMode, onToggleLock, onChangeCircuit, onOpenTiming, onOpenSettings, onLoadDemo }) {
      const hasDrivers = Array.isArray(state.drivers) && state.drivers.length > 0;
      const currentTargetName = targetDriverName || 'Alex R.';

      const matchedIndex = hasDrivers 
        ? state.drivers.findIndex(d => d.name && d.name.toLowerCase().includes(currentTargetName.toLowerCase()))
        : -1;

      // CAMBIO 3: Nunca usar drivers[0] como fallback — solo mostrar datos del piloto configurado
      const driver = matchedIndex !== -1 ? state.drivers[matchedIndex] : null;
      const driverAhead = (matchedIndex > 0 && hasDrivers) ? state.drivers[matchedIndex - 1] : null;
      const driverBehind = (matchedIndex >= 0 && matchedIndex < state.drivers.length - 1 && hasDrivers) ? state.drivers[matchedIndex + 1] : null;
      const isLeader = driver ? driver.position === 1 : false;

      // Calculate Stint Minimum Status (Red until minimum is reached, resets to Red on OUT pit exit)
      const eConfig = enduranceConfig || { stintMinType: 'time', stintMinValue: 15 };
      let isStintMinMet = true;
      let stintDisplay = "";

      if (raceMode === 'endurance') {
        const minVal = eConfig.stintMinValue || 0;
        if (eConfig.stintMinType === 'laps') {
          const currentStintLaps = driver ? (driver.stintLaps || 0) : 0;
          isStintMinMet = currentStintLaps >= minVal;
          stintDisplay = `STINT: ${currentStintLaps}/${minVal} VUELTAS`;
        } else {
          const elapsedMs = driver ? (driver.stintElapsedMs || 0) : 0;
          const elapsedMin = Math.floor(elapsedMs / 60000);
          const elapsedSec = Math.floor((elapsedMs % 60000) / 1000);
          const secStr = elapsedSec < 10 ? `0${elapsedSec}` : `${elapsedSec}`;
          isStintMinMet = elapsedMin >= minVal;
          stintDisplay = `STINT: ${elapsedMin}:${secStr} / ${minVal}m`;
        }
      }

      // CAMBIO 2: Cuando es líder, obtener P2 y P3 para mostrar sus gaps
      const p2Driver = (isLeader && hasDrivers && state.drivers.length > 1) ? state.drivers[1] : null;
      const p3Driver = (isLeader && hasDrivers && state.drivers.length > 2) ? state.drivers[2] : null;

      // Estado de búsqueda: hay datos en el timing pero el piloto no aparece
      const isSearching = hasDrivers && !driver && state.isLiveConnected;

      const deltaLastVsBest = driver ? (driver.lastLapMs - driver.bestLapMs) : 0;
      const deltaFormatted = !driver || driver.lastLapMs === 0
        ? "--:--" 
        : deltaLastVsBest === 0 
          ? "RÉCORD"

        }
      };

                {isSearching ? (
                  <div className="my-auto flex flex-col items-center gap-0.5">
                    <span className="text-3xl font-black font-mono text-gray-600 animate-pulse">--</span>
                    <span className="text-[9px] font-mono text-yellow-400 font-bold animate-pulse">🔍 Buscando...</span>

                ) : (
                  <div className="my-1 flex items-baseline justify-center">
                    <span className="text-lg font-black font-mono text-gray-500 mr-0.5">P</span>
                    <span className={`text-4xl font-black font-mono leading-none ${isLeader ? 'text-yellow-400' : 'text-[#00FF66]'}`}>

                <div className="flex flex-col items-center gap-0.5 w-full">
                  <span className="text-xs font-mono text-white font-extrabold truncate max-w-full px-1">{driver ? driver.name : currentTargetName}</span>
                  <span className="text-[9px] font-mono text-gray-300 font-bold bg-white/10 px-2 py-0.5 rounded-md">
                    {driver ? `KART #${driver.kartNumber}` : 'SIN KART'}

              <div className={`bg-[#0A0A0E] border-2 ${raceMode === 'endurance' ? 'border-amber-600/50' : 'border-gray-800'} rounded-2xl p-2.5 flex flex-col justify-between items-center text-center shadow-2xl h-full min-h-[110px]`}>

                  </span>
                </div>

                {/* FILA 2: Si es líder → P2. Si no → intervalo delante */}
                {isLeader ? (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-cyan-800/50">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-cyan-400">{p2Driver ? `P2 · #${p2Driver.kartNumber}` : 'P2'}</span>
                      <span className="text-[9px] text-cyan-600 truncate max-w-[140px]">
                        {p2Driver ? p2Driver.name : 'Sin datos'}
                        {raceMode === 'endurance' && p2Driver && p2Driver.pitCount > 0 && (
                          <span className="ml-1 text-amber-400 font-black">🛑{p2Driver.pitCount}</span>
                        )}
                      </span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-cyan-400">
                      {p2Driver ? apexTimingService.formatGap(p2Driver.gapLeaderMs) : '---'}
                    </span>
                  </div>
                ) : (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-gray-800">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-[#00FF66]">{driverAhead ? `INTERVALO ▲ #${driverAhead.kartNumber}` : 'INTERVALO DELANTE'}</span>
                      <span className="text-[9px] text-gray-500 truncate max-w-[140px]">
                        {driverAhead ? driverAhead.name : 'Kart anterior'}
                        {raceMode === 'endurance' && driverAhead && driverAhead.pitCount > 0 && (
                          <span className="ml-1 text-amber-400 font-black">🛑{driverAhead.pitCount}</span>
                        )}
                      </span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-[#00FF66]">
                      {driverAhead ? apexTimingService.formatGap(driver.intervalAheadMs) : '---'}
                    </span>
                  </div>
                )}

                {/* FILA 3: Si es líder → P3. Si no → intervalo detrás */}
                {isLeader ? (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-orange-800/50">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-orange-400">{p3Driver ? `P3 · #${p3Driver.kartNumber}` : 'P3'}</span>
                      <span className="text-[9px] text-orange-600 truncate max-w-[140px]">
                        {p3Driver ? p3Driver.name : 'Sin datos'}
                        {raceMode === 'endurance' && p3Driver && p3Driver.pitCount > 0 && (
                          <span className="ml-1 text-amber-400 font-black">🛑{p3Driver.pitCount}</span>
                        )}
                      </span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-orange-400">
                      {p3Driver ? apexTimingService.formatGap(p3Driver.gapLeaderMs) : '---'}
                    </span>
                  </div>
                ) : (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-gray-800">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-red-400">{driverBehind ? `INTERVALO ▼ #${driverBehind.kartNumber}` : 'INTERVALO DETRÁS'}</span>
                      <span className="text-[9px] text-gray-500 truncate max-w-[140px]">
                        {driverBehind ? driverBehind.name : 'Kart posterior'}
                        {raceMode === 'endurance' && driverBehind && driverBehind.pitCount > 0 && (
                          <span className="ml-1 text-amber-400 font-black">🛑{driverBehind.pitCount}</span>
                        )}
                      </span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-red-400">
                      {driverBehind ? apexTimingService.formatGap(driver.intervalBehindMs) : '---'}
                    </span>
                  </div>
                )}

              </div>
            </div>

            {/* ROW 3: ÚLTIMA VUELTA Y MEJOR VUELTA (2 EQUAL 50/50 CARDS IN PORTRAIT, COL-SPAN-4 IN LANDSCAPE) */}
            <div className={`${isLandscapeLayout ? 'col-span-4 flex flex-col gap-2 h-full' : 'grid grid-cols-2 gap-2 w-full min-h-[95px]'}`}>
              
              {/* CARD: ÚLTIMA VUELTA */}
              <div className="bg-[#0A0A0E] border-2 border-gray-800 rounded-2xl p-2.5 flex flex-col justify-between items-center text-center shadow-2xl h-full min-h-[95px]">
                <div className="w-full flex justify-between items-center">
                  <span className="text-gray-400 font-black text-[10px] uppercase tracking-widest">ÚLTIMA</span>
                  <span className={`text-[10px] font-mono font-black ${deltaLastVsBest <= 0 ? 'text-[#00FF66]' : 'text-yellow-400'}`}>{deltaFormatted}</span>
                </div>
                <div className="my-auto flex items-center justify-center">
                  <span className="text-2xl sm:text-3xl lg:text-4xl font-black font-mono text-white tracking-tighter">
                    {driver ? apexTimingService.formatTime(driver.lastLapMs) : '--:--.---'}
                  </span>
                </div>
              </div>

              {/* CARD: MEJOR VUELTA */}
              <div className="bg-[#0A0A0E] border-2 border-purple-600/50 rounded-2xl p-2.5 flex flex-col justify-between items-center text-center shadow-2xl h-full min-h-[95px]">
                <div className="w-full flex justify-between items-center">
                  <span className="text-gray-400 font-black text-[10px] uppercase tracking-widest">MEJOR</span>
                  <span className="text-[9px] px-1.5 py-0.5 rounded font-mono font-bold bg-purple-600/20 text-purple-300 border border-purple-500/30">
                    BEST
                  </span>
                </div>
                <div className="my-auto flex items-center justify-center">
                  <span className="text-2xl sm:text-3xl lg:text-4xl font-black font-mono text-purple-400 tracking-tighter">
                    {driver ? apexTimingService.formatTime(driver.bestLapMs) : '--:--.---'}
                  </span>
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // 5. MAIN CONTAINER / COORDINATOR (INCLUDES PHYSICAL CSS ROTATION LOCK)
    // =========================================================================
    function App() {
      const [timingState, setTimingState] = useState(apexTimingService.state);
      const [targetDriverName, setTargetDriverName] = useState(apexTimingService.targetDriverName);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isTimingOpen, setIsTimingOpen] = useState(false);
      
      // Race Mode states
      const [raceMode, setRaceMode] = useState(
        localStorage.getItem('kart_race_mode') || 'sprint'
      );
      const [enduranceConfig, setEnduranceConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('kart_endurance_config');
          return saved ? JSON.parse(saved) : {
            requiredStops: 1,
            stintMinType: 'time',
            stintMinValue: 15,
            stintMaxType: 'time',
            stintMaxValue: 45
          };
        } catch (e) {
          return { requiredStops: 1, stintMinType: 'time', stintMinValue: 15, stintMaxType: 'time', stintMaxValue: 45 };
        }
      });

      // Orientation Lock states
      const [isOrientationLocked, setIsOrientationLocked] = useState(
        localStorage.getItem('kart_orientation_locked') === 'true'
      );
      const [isViewportPortrait, setIsViewportPortrait] = useState(
        window.innerHeight > window.innerWidth
      );

      useEffect(() => {
        const unsubscribe = apexTimingService.subscribe((newState) => {
          setTimingState(newState);
        });
        apexTimingService.start();

        const handleResize = () => {
          setIsViewportPortrait(window.innerHeight > window.innerWidth);
        };
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);

        // Apply native lock where supported
        if (isOrientationLocked) {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }

        return () => {
          unsubscribe();
          apexTimingService.stop();
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('orientationchange', handleResize);
        };
      }, [isOrientationLocked]);

      const handleSaveDriverName = (name) => {
        setTargetDriverName(name);
        apexTimingService.setTargetDriverName(name);
      };

      const handleChangeCircuit = (circuitId) => {
        apexTimingService.setCircuit(circuitId);
      };

      const handleToggleMode = () => {
        const newMode = raceMode === 'sprint' ? 'endurance' : 'sprint';
        setRaceMode(newMode);
        localStorage.setItem('kart_race_mode', newMode);
      };

      const handleSaveEnduranceConfig = (config) => {
        setEnduranceConfig(config);
        localStorage.setItem('kart_endurance_config', JSON.stringify(config));
      };

      const handleToggleOrientationLock = () => {
        const newLockState = !isOrientationLocked;
        setIsOrientationLocked(newLockState);
        localStorage.setItem('kart_orientation_locked', String(newLockState));

        if (newLockState) {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        } else {
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        }
      };

      // Hardware rotation block: If lock is active and phone is turned to portrait,
      // we rotate the content container by 90deg using CSS transforms to keep it landscape!
      const shouldApplyPhysicalRotation = isOrientationLocked && isViewportPortrait;

      const containerStyle = shouldApplyPhysicalRotation
        ? {
            position: 'absolute',
            top: 0,
            left: '100%',
            width: '100vh',
            height: '100vw',
            transform: 'rotate(90deg)',
            transformOrigin: 'top left',
            overflow: 'hidden'
          }
        : {
            width: '100%',
            height: '100%',
            overflow: 'hidden'
          };

      return (
        <div style={containerStyle} className="relative">
          {/* Main Dashboard HUD */}
          <PitboardHUD 
            state={timingState} 
            targetDriverName={targetDriverName} 
            isLocked={isOrientationLocked}
            isViewportPortrait={isViewportPortrait}
            raceMode={raceMode}
            enduranceConfig={enduranceConfig}
            onToggleMode={handleToggleMode}
            onToggleLock={handleToggleOrientationLock}
            onChangeCircuit={handleChangeCircuit}
            onOpenTiming={() => setIsTimingOpen(true)}
            onOpenSettings={() => setIsSettingsOpen(true)}
            onLoadDemo={() => apexTimingService.loadDemoData()}
          />
          <SettingsModal 
            isOpen={isSettingsOpen} 
            onClose={() => setIsSettingsOpen(false)} 
            targetDriverName={targetDriverName}
            onSaveDriverName={handleSaveDriverName}
            raceMode={raceMode}
            enduranceConfig={enduranceConfig}
            onSaveEnduranceConfig={handleSaveEnduranceConfig}
          />
          <TimingModal 
            isOpen={isTimingOpen} 
            onClose={() => setIsTimingOpen(false)} 
            activeCircuitId={timingState.activeCircuitId}
          />
        </div>
      );
    }

    // Mount App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
